<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งพิกัดน้ำประปาแตก - SmartWater</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap');
        body { 
            font-family: 'Kanit', sans-serif; 
            text-align: center; 
            padding-top: 60px; 
            background-color: #f0f4f8; 
            color: #2c3e50;
            margin: 0;
        }
        .container { padding: 20px; }
        .loader { 
            border: 5px solid #f3f3f3; 
            border-top: 5px solid #1a73e8; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
            margin: 30px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { font-size: 1.1rem; font-weight: 400; line-height: 1.6; }
        .highlight { color: #1a73e8; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <div id="status" class="status-text">
            ระบบกำลังค้นหา <span class="highlight">พิกัดที่แม่นยำที่สุด</span><br>
            กรุณารอสักครู่...
        </div>
    </div>

    <script>
        async function main() {
            try {
                // 1. เริ่มต้น LIFF
                await liff.init({ liffId: "2009159637-UYJ3xxUc" }); 

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    // 2. ดึงพิกัด GPS จากมือถือ
                    navigator.geolocation.getCurrentPosition(async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        document.getElementById('status').innerHTML = "กำลังแปลงพิกัดเป็น <span class='highlight'>ชื่อที่อยู่จริง...</span>";

                        // 3. ดึงชื่อที่อยู่จริงจาก OpenStreetMap API (Reverse Geocoding)
                        let addressName = "พิกัด: " + lat.toFixed(6) + ", " + lon.toFixed(6);
                        
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1`, {
                                headers: { 'Accept-Language': 'th-TH' }
                            });
                            const data = await response.json();
                            if (data.display_name) {
                                // ใช้ชื่อสถานที่จริงที่ได้จาก API
                                addressName = data.display_name;
                            }
                        } catch (err) {
                            console.error("Geocoding Error:", err);
                        }

                        // 4. ส่งข้อความ Location กลับไปที่แชท
                        await liff.sendMessages([{
                            type: "location",
                            title: "📍 พบเหตุน้ำประปาแตก",
                            address: addressName, // ส่งชื่อสถานที่จริงไปแทน
                            latitude: lat,
                            longitude: lon
                        }]);
                        
                        document.getElementById('status').innerHTML = "<span style='color:#27ae60;'>✔️ ส่งพิกัดเรียบร้อยแล้ว</span>";
                        
                        // ปิดหน้าต่าง LIFF หลังจากส่งเสร็จ 1.5 วินาที
                        setTimeout(() => liff.closeWindow(), 1500); 
                        
                    }, (error) => {
                        document.getElementById('status').innerHTML = "<span style='color:#e74c3c;'>⚠️ กรุณาเปิด GPS และอนุญาตสิทธิ์ตำแหน่ง</span>";
                        console.error(error);
                    }, { 
                        enableHighAccuracy: true, 
                        timeout: 10000, 
                        maximumAge: 0 
                    });
                }
            } catch (error) {
                document.getElementById('status').innerText = "เกิดข้อผิดพลาด: " + error.message;
            }
        }
        main();
    </script>
</body>
</html>
